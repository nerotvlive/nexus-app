<div id="settings" class="position-absolute d-flex w-100 h-100 p-0 m-0">

        <div id="settings-loader-card" class="card download-card loading-download-card shadow m-3">
            <div class="card-header">
                <div class="d-flex" id="settings-loader">
                    <div class="spinner-border p-2 me-2" style="height: 1rem; width: 1rem;" role="status">

            </div>
            <div class="card-body">
                Please wait...<br>
            </div>
        </div>
    </div>
    <div class="settings-sidecard d-lg-block d-none shadow">

    </div>
</div>
